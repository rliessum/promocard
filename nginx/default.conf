server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml font/woff2;

    location = /version.json {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }
    location ~* \.(?:css|js|png|jpe?g|gif|svg|webp|avif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ $uri.html /index.html;
    }
}
